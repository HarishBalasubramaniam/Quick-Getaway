<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a1710" />
    <title>Oi Pouty!! — Just for us</title>
    <meta name="description" content="A birthday surprise, made just for us." />
    <link rel="stylesheet" href="styles.css?v=new-square-sunset-20260822" />
  </head>
  <body>
    <div class="journey">
      <div class="journey__blur" aria-hidden="true"></div>
      <div class="journey__image" aria-hidden="true"></div>
      <div class="journey__shade" aria-hidden="true"></div>

    <main class="hero">
      <div class="hero__shade" aria-hidden="true"></div>
      <div class="hero__frame" aria-hidden="true"></div>

      <section class="hero__content" aria-labelledby="hero-title">
        <h1 id="hero-title">Oi Pouty!</h1>
        <p class="hero__eyebrow">A little escape</p>
        <p class="hero__statement">Just for us</p>
        <p class="hero__note">Pack your bags, Let’s Go!</p>
        <span class="hero__rule" aria-hidden="true"></span>

        <button class="date-trigger" id="date-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>Select your Dates</span>
          <span class="date-trigger__arrow" aria-hidden="true">→</span>
        </button>
      </section>
    </main>

    <section class="surprise" id="surprise">
      <p>One tiny question at a time</p>
      <h2>Ready to choose our escape?</h2>
    </section>
    </div>

    <dialog class="calendar" id="calendar" aria-labelledby="calendar-title">
      <div class="calendar__topline">
        <div>
          <p class="calendar__eyebrow">Select your dates</p>
          <h2 id="calendar-title">September 2026</h2>
        </div>
        <button class="calendar__close" id="calendar-close" type="button" aria-label="Close calendar">×</button>
      </div>

      <div class="calendar__weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="calendar__days" id="calendar-days" role="grid" aria-label="September 2026"></div>

      <div class="calendar__legend">
        <span><i class="legend-start"></i>Departure</span>
        <span><i class="legend-birthday"></i>Pouty’s birthday</span>
        <span><i class="legend-return"></i>Your return</span>
      </div>
      <p class="calendar__selection" id="calendar-selection" aria-live="polite">24–27 September 2026 · 3 Days</p>
      <button class="calendar__done" id="calendar-done" type="button">Let the Surprise Begin <span aria-hidden="true">→</span></button>
    </dialog>

    <script src="script.js?v=photo-flow-20260822"></script>
  </body>
</html>
