<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#130a08">
  <meta name="robots" content="noindex, nofollow">
  <title>The Getaway Dossier — Oi Pouty!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css?v=3d-dossier">
</head>
<body>
  <main class="dossier">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="dossier__brand">OI POUTY! <span>•</span> PRIVATE DOSSIER</div>
    <div class="dossier__progress" id="progress" aria-label="Reveal progress"></div>
    <section class="dossier__panel" id="panel" aria-live="polite">
      <p class="dossier__eyebrow" id="eyebrow">A tiny secret is waiting</p>
      <h1 id="title">Ready for<br><em>the final reveal?</em></h1>
      <p class="dossier__copy" id="copy">You’ve chosen every ingredient. Now let’s open the little getaway dossier.</p>
      <button class="dossier__button" id="next" type="button">Open the dossier <span aria-hidden="true">→</span></button>
      <p class="dossier__hint" id="hint">Drag the suitcase around if you’re curious. No peeking ahead though. 😉</p>
    </section>
    <p class="dossier__date">24 — 28 SEPTEMBER 2026</p>
  </main>
  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
  <script src="script.js?v=3d-dossier"></script>
</body>
</html>
